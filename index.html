<script type="text/plain" id="engine-py">
import re
import copy
import random
from docx import Document
from docx.oxml.ns import qn
from docx.text.run import Run as _DocxRun
from docx.oxml import OxmlElement

QUESTION_RE = re.compile(r'^\s*(?:Câu|Question)\s+(\d+)\s*[\.:]', re.IGNORECASE)
PART_HEAD_RE = re.compile(r'^\s*(?:PHẦN|PART|SECTION)\s+(?:[IVX]+|\d+)\b', re.IGNORECASE)
STMT_START_RE = re.compile(r'^\s*([abcd])\)\s')
PART_RE = re.compile(r'(?:PHẦN|PART|SECTION)\s+([IVX123]+)', re.IGNORECASE)
OPTION_START_RE = re.compile(r'^\s*([ABCD])\.\s')
INLINE_OPTIONS_RE = re.compile(r'(?P<A>A\.\s.*?)(?=\t?\s*B\.\s)\t?\s*(?P<B>B\.\s.*?)(?=\t?\s*C\.\s)\t?\s*(?P<C>C\.\s.*?)(?=\t?\s*D\.\s)\t?\s*(?P<D>D\.\s.*)$', re.DOTALL)
CIRCLED = {"A": "\u24B6", "B": "\u24B7", "C": "\u24B8", "D": "\u24B9"}

ANS_RE = re.compile(r'^\s*(?:Đáp\s*án|ĐS|Kết\s*quả|ĐÁP\s*ÁN)\s*[:\.]', re.IGNORECASE)
ANS_PREFIX_RE = re.compile(r'^\s*(?:Đáp\s*án|ĐS|Kết\s*quả)\s*[:\.]\s*', re.IGNORECASE)

def _is_part_head(text):
    return bool(PART_HEAD_RE.match((text or "").replace("\u200b", "")))

class _TableItem:
    is_table = True
    def __init__(self, tbl): self._p = tbl

def get_para_elements(paragraph):
    if getattr(paragraph, 'is_table', False): return [], ""
    spans = []
    pos = 0
    full_text = ""
    for child in paragraph._p:
        tag = child.tag
        if tag == qn('w:pPr'): continue
        if tag == qn('w:r'): t = _DocxRun(child, paragraph).text or ""
        else: t = " " 
        length = len(t)
        if length == 0: t = "\u200B"; length = 1
        spans.append((pos, pos + length, child, t))
        pos += length
        full_text += t
    return spans, full_text

def para_text(paragraph): 
    _, text = get_para_elements(paragraph)
    return text

def copy_rpr(new_run, source_run, strip_underline=False):
    src_rpr = source_run.find(qn('w:rPr'))
    if src_rpr is not None:
        new_rpr = copy.deepcopy(src_rpr)
        if strip_underline:
            for u in list(new_rpr.findall(qn('w:u'))): new_rpr.remove(u)
        old = new_run.find(qn('w:rPr'))
        if old is not None: new_run.remove(old)
        new_run.insert(0, new_rpr)

def copy_ppr(new_paragraph, source_paragraph):
    src_ppr = source_paragraph._p.find(qn('w:pPr'))
    if src_ppr is not None:
        new_ppr = copy.deepcopy(src_ppr)
        old = new_paragraph._p.find(qn('w:pPr'))
        if old is not None: new_paragraph._p.remove(old)
        new_paragraph._p.insert(0, new_ppr)

class ParaSpec:
    __slots__ = ("source_paragraph", "segments", "table")
    def __init__(self, source_paragraph, segments):
        self.source_paragraph = source_paragraph
        self.segments = segments
        self.table = None

class Option:
    __slots__ = ("letter_orig", "segments", "is_correct", "tf_ans", "orig_segments")
    def __init__(self, letter_orig, segments, is_correct, tf_ans=None, orig_segments=None):
        self.letter_orig = letter_orig
        self.segments = segments
        self.is_correct = is_correct
        self.tf_ans = tf_ans
        self.orig_segments = orig_segments if orig_segments is not None else segments

class QuestionBlock:
    __slots__ = ("id", "number", "stem_paragraphs", "options", "options_mode", "options_ppr_source", "options_ppr_source2", "short_answer_spec")
    def __init__(self, qid, number):
        self.id = qid
        self.number = number
        self.stem_paragraphs = []
        self.options = []
        self.options_mode = None
        self.options_ppr_source = None
        self.options_ppr_source2 = None
        self.short_answer_spec = None

def _seg_slice(spans, a, b, refs=None):
    segments = []
    splits = {a, b}
    ref_list = refs or []
    for s0, e0, _q in ref_list:
        splits.add(s0); splits.add(e0)

    def _match_ref(pos):
        for s0, e0, q in ref_list:
            if s0 <= pos < e0: return q, (pos == s0)
        return None, False

    for s, e, el, t in spans:
        if e <= a or s >= b: continue
        if el.tag == qn('w:r'):
            local_splits = sorted(list(set(sp - s for sp in splits if s < sp < e)))
            curr = 0
            needs_slicing = len(local_splits) > 0 
            for ls in local_splits + [len(t)]:
                if curr == ls: continue
                chunk_s = s + curr; chunk_e = s + ls
                if chunk_s >= b or chunk_e <= a: curr = ls; continue
                ref_qid, ref_first = _match_ref(chunk_s)
                sliced_t = t[curr:ls]
                segments.append((el, sliced_t, needs_slicing, ref_qid, ref_first))
                curr = ls
        else:
            segments.append((el, t, False, None, False))
    return segments

def _make_para_spec(paragraph, a=0, b=None, refs=None):
    if getattr(paragraph, 'is_table', False):
        sp = ParaSpec(paragraph, []); sp.table = paragraph._p; return sp
    spans, full_text = get_para_elements(paragraph)
    if b is None: b = len(full_text)
    segments = _seg_slice(spans, a, b, refs)
    return ParaSpec(paragraph, segments)

def _extract_tf_answer_start(segments):
    text = ""
    for el, sliced_t, ns, ref_qid, ref_first in segments:
        if el.tag == qn('w:r'): text += sliced_t
    m = re.match(r'^(\s*(?:[A-Dabcd][\.\)]\s*)*)([ĐSđs])([\.\s:]+|$)', text)
    if not m: return segments, None
    tf_ans = m.group(2).upper()
    start_remove = len(m.group(1)); len_remove = len(m.group(2)) + len(m.group(3))
    new_segments = []
    current_pos = 0
    for el, sliced_t, ns, ref_qid, ref_first in segments:
        if el.tag == qn('w:r'):
            l = len(sliced_t)
            if current_pos >= start_remove + len_remove or current_pos + l <= start_remove:
                new_segments.append((el, sliced_t, ns, ref_qid, ref_first))
            else:
                keep_left = max(0, start_remove - current_pos)
                end_remove = start_remove + len_remove
                keep_right_start = max(0, end_remove - current_pos)
                new_t = sliced_t[:keep_left] + sliced_t[keep_right_start:]
                new_segments.append((el, new_t, True, ref_qid, ref_first))
            current_pos += l
        else:
            new_segments.append((el, sliced_t, ns, ref_qid, ref_first))
    return new_segments, tf_ans

def _mark_option_correctness(segments):
    if not segments: return segments, False, None
    is_correct = False
    for el, sliced_t, needs_slicing, ref_qid, ref_first in segments:
        if el.tag == qn('w:r'):
            rpr = el.find(qn('w:rPr'))
            if rpr is not None:
                u = rpr.find(qn('w:u'))
                if u is not None and u.get(qn('w:val')) not in (None, 'none', '0', 'false'):
                    is_correct = True; break
    new_segments, tf_ans = _extract_tf_answer_start(segments)
    return new_segments, is_correct, tf_ans

def _extract_inline_options(paragraph, options_text_start):
    spans, full_text = get_para_elements(paragraph)
    sub = full_text[options_text_start:]
    m = INLINE_OPTIONS_RE.search(sub)
    if not m: return None, None
    options = []
    for letter in "ABCD":
        abs_start = options_text_start + m.start(letter)
        abs_end = options_text_start + m.end(letter)
        orig = _seg_slice(spans, abs_start, abs_end)
        segs, is_correct, tf_ans = _mark_option_correctness(orig)
        options.append(Option(letter, segs, is_correct, tf_ans, orig))
    stem_end_abs = options_text_start + m.start('A')
    return options, stem_end_abs

def _extract_pair(paragraph, la, lb):
    spans, full_text = get_para_elements(paragraph)
    m = re.search(r'(?P<X>%s\.\s.*?)(?=\t?\s*%s\.\s)\t?\s*(?P<Y>%s\.\s.*)$' % (la, lb, lb), full_text, re.DOTALL)
    if not m: return None
    out = []
    for letter, key in ((la, "X"), (lb, "Y")):
        orig = _seg_slice(spans, m.start(key), m.end(key))
        segs, is_correct, tf_ans = _mark_option_correctness(orig)
        out.append(Option(letter, segs, is_correct, tf_ans, orig))
    return out

def _extract_separate_options(paragraphs4, letters="ABCD"):
    options = []
    for letter, p in zip(letters, paragraphs4):
        spans, full_text = get_para_elements(p)
        orig = _seg_slice(spans, 0, len(full_text))
        segs, is_correct, tf_ans = _mark_option_correctness(orig)
        options.append(Option(letter, segs, is_correct, tf_ans, orig))
    return options

def _spec_text(spec):
    return "".join(t for el, t, _s, _q, _f in spec.segments).replace("\u200b", "")

def parse_exam(docx_path):
    doc = Document(docx_path)
    from docx.text.paragraph import Paragraph
    paragraphs = []
    for child in doc.element.body:
        if child.tag == qn('w:p'): paragraphs.append(Paragraph(child, doc._body))
        elif child.tag == qn('w:tbl'): paragraphs.append(_TableItem(child))
    n = len(paragraphs)
    marker_at, marker_span_at = {} , {}
    for i, p in enumerate(paragraphs):
        m = QUESTION_RE.search(para_text(p))
        if m:
            marker_at[i] = int(m.group(1)); marker_span_at[i] = m.span(1)

    marker_indices = sorted(marker_at.keys())
    prelude, questions, fillers_after = [], [], {}
    first_marker_idx = marker_indices[0] if marker_indices else n
    for i in range(0, first_marker_idx): prelude.append(_make_para_spec(paragraphs[i]))

    for mi_pos, idx in enumerate(marker_indices):
        qnum = marker_at[idx]
        qid = mi_pos 
        num_span = marker_span_at[idx]
        qb = QuestionBlock(qid, qnum)
        marker_para = paragraphs[idx]
        marker_para_text = para_text(marker_para)
        after_marker = QUESTION_RE.search(marker_para_text).end()
        next_marker_idx = marker_indices[mi_pos + 1] if mi_pos + 1 < len(marker_indices) else n

        num_refs = [(num_span[0], num_span[1], qb.id)]
        opts, stem_end_abs = _extract_inline_options(marker_para, after_marker)
        cursor = idx + 1
        if opts is not None:
            qb.stem_paragraphs.append(_make_para_spec(marker_para, 0, stem_end_abs, refs=num_refs))
            qb.options = opts; qb.options_mode = 'inline_with_marker'; qb.options_ppr_source = marker_para
        else:
            qb.stem_paragraphs.append(_make_para_spec(marker_para, 0, len(marker_para_text), refs=num_refs))
            found_options = False
            while cursor < next_marker_idx:
                p = paragraphs[cursor]; text = para_text(p)
                if _is_part_head(text): break
                if OPTION_START_RE.match(text):
                    m_inline = INLINE_OPTIONS_RE.search(text)
                    if m_inline and m_inline.start('A') == len(text) - len(text.lstrip()):
                        opts, _ = _extract_inline_options(p, 0)
                        qb.options = opts; qb.options_mode = 'same_line'; qb.options_ppr_source = p
                        cursor += 1; found_options = True; break
                    m0 = OPTION_START_RE.match(text)
                    if m0.group(1) == 'A' and cursor + 3 < next_marker_idx:
                        p2, p3, p4 = paragraphs[cursor + 1], paragraphs[cursor + 2], paragraphs[cursor + 3]
                        m1, m2, m3 = OPTION_START_RE.match(para_text(p2)), OPTION_START_RE.match(para_text(p3)), OPTION_START_RE.match(para_text(p4))
                        if m1 and m1.group(1) == 'B' and m2 and m2.group(1) == 'C' and m3 and m3.group(1) == 'D':
                            opts = _extract_separate_options([p, p2, p3, p4])
                            qb.options = opts; qb.options_mode = 'separate'; qb.options_ppr_source = p
                            cursor += 4; found_options = True; break
                if re.match(r'^\s*A\.\s', text) and cursor + 1 < next_marker_idx and re.match(r'^\s*C\.\s', para_text(paragraphs[cursor + 1])):
                    ab = _extract_pair(p, 'A', 'B')
                    cd = _extract_pair(paragraphs[cursor + 1], 'C', 'D')
                    if ab and cd:
                        qb.options = ab + cd; qb.options_mode = 'two_lines'
                        qb.options_ppr_source = p; qb.options_ppr_source2 = paragraphs[cursor + 1]
                        cursor += 2; found_options = True; break
                ms = STMT_START_RE.match(text)
                if ms and ms.group(1) == 'a' and cursor + 3 < next_marker_idx:
                    rest = [paragraphs[cursor + k] for k in (1, 2, 3)]
                    ms2 = [STMT_START_RE.match(para_text(r)) for r in rest]
                    if all(ms2) and [m_.group(1) for m_ in ms2] == ['b', 'c', 'd']:
                        qb.options = _extract_separate_options([p] + rest, "abcd")
                        qb.options_mode = 'separate'; qb.options_ppr_source = p
                        cursor += 4; found_options = True; break
                qb.stem_paragraphs.append(_make_para_spec(p))
                cursor += 1
            if not found_options: qb.options = []; qb.options_mode = None

        fillers_after[qid] = []
        for i in range(cursor, next_marker_idx): fillers_after[qid].append(_make_para_spec(paragraphs[i]))

        found_ans = False
        for i in reversed(range(len(fillers_after[qid]))):
            ptxt = _spec_text(fillers_after[qid][i])
            if ANS_RE.match(ptxt):
                qb.short_answer_spec = fillers_after[qid][i]
                fillers_after[qid].pop(i)
                found_ans = True; break
                
        if not found_ans:
            for i in reversed(range(len(qb.stem_paragraphs))):
                ptxt = _spec_text(qb.stem_paragraphs[i])
                if ANS_RE.match(ptxt):
                    qb.short_answer_spec = qb.stem_paragraphs[i]
                    qb.stem_paragraphs.pop(i)
                    break
        questions.append(qb)
    return {"doc_path": docx_path, "prelude": prelude, "questions": questions, "fillers_after": fillers_after}

def _spec_has_content(spec):
    for el, t, _s, _q, _f in spec.segments:
        if el.tag == qn('w:r'):
            if t.replace("\u200b", "").strip(): return True
        else:
            if el.tag.endswith('}oMath') or el.tag.endswith('}oMathPara'): return True
            if "".join(el.itertext()).replace("\u200b", "").strip(): return True
    return False

def _run_is_bold(el, para):
    rpr = el.find(qn('w:rPr'))
    if rpr is not None:
        b = rpr.find(qn('w:b'))
        if b is not None: return b.get(qn('w:val')) not in ('0', 'false', 'off')
    try: return bool(para.style.font.bold)
    except Exception: return False

def _spec_is_bold(spec):
    total = bold = 0
    for el, t, _s, _q, _f in spec.segments:
        if el.tag != qn('w:r'): continue
        n = sum(1 for c in t if not c.isspace() and c != "\u200b")
        if n == 0: continue
        total += n
        if _run_is_bold(el, spec.source_paragraph): bold += n
    return total > 0 and bold / total >= 0.6

def _header_specs(parsed, i, qids):
    if i > 0: return list(parsed["fillers_after"].get(qids[i - 1], []))
    specs = list(parsed["prelude"]) if qids[0] == 0 else list(parsed["fillers_after"].get(qids[0] - 1, []))
    tail = []
    for sp in reversed(specs):
        if _spec_has_content(sp): tail.append(sp)
        elif tail: break
    return list(reversed(tail))

def _source_specs_list(parsed, i, qids):
    if i > 0: return parsed["fillers_after"].setdefault(qids[i - 1], [])
    if qids[0] == 0: return parsed["prelude"]
    return parsed["fillers_after"].setdefault(qids[0] - 1, [])

def _annotate_number_refs(spec, num_at, qids, lo, hi):
    if spec.table is not None: return spec, False
    spans, full_text = get_para_elements(spec.source_paragraph)
    ref_spans = []
    for m in re.finditer(r'\d+', full_text):
        pos = num_at.get(int(m.group()))
        if pos is not None and lo <= pos <= hi:
            ref_spans.append((m.start(), m.end(), qids[pos]))
    if not ref_spans: return spec, False
    new_segments = _seg_slice(spans, 0, len(full_text), ref_spans)
    return ParaSpec(spec.source_paragraph, new_segments), True

def _detect_segments(parsed, part):
    qids = list(range(part["q_from_id"], part["q_to_id"] + 1))
    n = len(qids)
    num_at = {parsed["questions"][q].number: k for k, q in enumerate(qids)}
    heads = {}
    for i in range(n):
        specs = _header_specs(parsed, i, qids)
        bold = [sp for sp in specs if _spec_has_content(sp) and _spec_is_bold(sp) and not _is_part_head(_spec_text(sp))]
        if bold: heads[i] = (bold, [sp for sp in specs if sp not in bold and _spec_has_content(sp)])
    starts = sorted(heads)
    segments, cursor = [], 0
    for si, i in enumerate(starts):
        bold, others = heads[i]
        nxt = starts[si + 1] if si + 1 < len(starts) else n
        end = nxt - 1
        text = " ".join(_spec_text(sp) for sp in bold)
        ks = [num_at[x] for x in (int(v) for v in re.findall(r'\d+', text)) if x in num_at and num_at[x] >= i]
        j = max(ks) if ks and min(ks) == i else None
        if j is not None and j < end: end = j
        explicit_refs = j is not None and j > i and not (i == 0 and j == n - 1)
        passage = i > 0 and len(others) > 0
        force_lock = bool(explicit_refs)

        source_list = _source_specs_list(parsed, i, qids)
        for bi, sp in enumerate(bold):
            annotated, found = _annotate_number_refs(sp, num_at, qids, i, end)
            if found:
                try:
                    src_idx = source_list.index(sp)
                    source_list[src_idx] = annotated
                except ValueError: pass
                bold[bi] = annotated

        if i > cursor: segments.append({"qids": qids[cursor:i], "header": False, "shared": False, "force_lock": False})
        segments.append({"qids": qids[i:end + 1], "header": True, "shared": bool(explicit_refs or passage), "force_lock": force_lock})
        cursor = end + 1
    if cursor < n: segments.append({"qids": qids[cursor:], "header": False, "shared": False, "force_lock": False})
    for sg in segments:
        sg["q_from"] = parsed["questions"][sg["qids"][0]].number
        sg["q_to"] = parsed["questions"][sg["qids"][-1]].number
    return segments

_ROMAN = {"I": 1, "II": 2, "III": 3, "IV": 4}

def _part_kind(label):
    m = re.search(r'(?:PHẦN|PART|SECTION)\s+(IV|III|II|I|\d+)\b', (label or "").upper())
    if not m: return 0
    g = m.group(1).upper()
    return _ROMAN.get(g) or int(g)

def _restore_non_tf_options(parsed, parts):
    qmap = {q.id: q for q in parsed["questions"]}
    for part in parts:
        if _part_kind(part["label"]) == 2: continue
        for qid in range(part["q_from_id"], part["q_to_id"] + 1):
            for opt in qmap[qid].options:
                if opt.tf_ans is not None and opt.letter_orig not in "abcd":
                    opt.segments = opt.orig_segments
                    opt.tf_ans = None

def detect_parts(parsed):
    parts = []
    questions = parsed["questions"]
    if not questions: return parts

    current_label = "Phần I"
    part_qids = []

    def extract_part_label(specs):
        for spec in specs:
            if spec.table: continue
            text = "".join(seg[1] for seg in spec.segments).replace("\u200b", "").strip()
            if _is_part_head(text): return text
        return None

    lbl = extract_part_label(parsed["prelude"])
    if lbl: current_label = lbl

    for q in questions:
        if q.id > 0:
            lbl = extract_part_label(parsed["fillers_after"].get(q.id - 1, []))
            if lbl:
                if part_qids:
                    parts.append({
                        "label": current_label[:100], "q_from_id": part_qids[0], "q_to_id": part_qids[-1],
                        "is_cloze": False, "explicit_lock": False, "from_regex": False
                    })
                    part_qids = []
                current_label = lbl
        part_qids.append(q.id)

    if part_qids:
        parts.append({
            "label": current_label[:100], "q_from_id": part_qids[0], "q_to_id": part_qids[-1],
            "is_cloze": False, "explicit_lock": False, "from_regex": False
        })

    for p in parts:
        p["q_from"] = parsed["questions"][p["q_from_id"]].number
        p["q_to"] = parsed["questions"][p["q_to_id"]].number
        p["segments"] = _detect_segments(parsed, p)

    _restore_non_tf_options(parsed, parts)
    return parts

def shuffle_plan(parsed, parts, opts, rng=None):
    if rng is None: rng = random
    questions = parsed["questions"]
    qmap = {q.id: q for q in questions}
    all_ids = sorted(qmap.keys())
    
    q_to_block_id = {}
    block_count = 0
    # Xử lý riêng cho môn Tiếng Anh: Nếu không chia PART rõ ràng, gộp các đoạn in đậm thành PART để xáo trộn
    treat_segments_as_blocks = opts.get("shuffle_parts", False) and len(parts) == 1
    
    for pi, part in enumerate(parts):
        if treat_segments_as_blocks and part.get("segments") and len(part["segments"]) > 1:
            for si, seg in enumerate(part["segments"]):
                for q_id in seg["qids"]:
                    q_to_block_id[q_id] = (pi, block_count, si)
                block_count += 1
        else:
            for q_id in range(part["q_from_id"], part["q_to_id"] + 1):
                q_to_block_id[q_id] = (pi, block_count, None)
            block_count += 1
            
    blocks = []
    current_block = None
    for q_id in all_ids:
        p, b_id, s_idx = q_to_block_id.get(q_id, (None, None, None))
        if current_block is None or current_block.get("b_id") != b_id:
            if current_block is not None: blocks.append(current_block)
            current_block = {"part_idx": p, "b_id": b_id, "seg_idx": s_idx, "qids": [], "specs_before": [], "specs_internal": {}}
        current_block["qids"].append(q_id)
    if current_block is not None: blocks.append(current_block)
        
    prelude = list(parsed["prelude"])
    global_header = prelude
    head_idx = next((k for k, sp in enumerate(prelude) if _is_part_head(_spec_text(sp))), None)
    
    if head_idx is not None and blocks:
        global_header = prelude[:head_idx]
        blocks[0]["specs_before"] = prelude[head_idx:] + blocks[0]["specs_before"]
    elif treat_segments_as_blocks and blocks:
        tail_start = len(prelude)
        for k in reversed(range(len(prelude))):
            if _spec_has_content(prelude[k]):
                if _spec_is_bold(prelude[k]): tail_start = k
                else: break
            else:
                if tail_start < len(prelude): break
        if tail_start < len(prelude):
            global_header = prelude[:tail_start]
            blocks[0]["specs_before"] = prelude[tail_start:] + blocks[0]["specs_before"]
    
    for i, block in enumerate(blocks):
        for j, q_id in enumerate(block["qids"]):
            if j == len(block["qids"]) - 1: 
                if i + 1 < len(blocks): blocks[i + 1]["specs_before"].extend(parsed["fillers_after"].get(q_id, []))
                else: block["specs_internal"][q_id] = parsed["fillers_after"].get(q_id, [])
            else: block["specs_internal"][q_id] = parsed["fillers_after"].get(q_id, [])
                
    if opts.get("shuffle_parts", False):
        if treat_segments_as_blocks:
            part_cfg = opts.get(0, {})
            locks = part_cfg.get("locks", [])
            movable_indices = []
            movable_blocks = []
            for idx, b in enumerate(blocks):
                si = b.get("seg_idx")
                is_locked = False
                if si is not None and si < len(locks): is_locked = bool(locks[si])
                if not is_locked:
                    movable_indices.append(idx)
                    movable_blocks.append(b)
            rng.shuffle(movable_blocks)
            for idx, b in zip(movable_indices, movable_blocks):
                blocks[idx] = b
        else:
            rng.shuffle(blocks)
            
    option_perm = {}
    for q_id, q in qmap.items(): option_perm[q_id] = list(q.options)
        
    for block in blocks:
        p_idx = block["part_idx"]
        if p_idx is not None:
            cfg = opts.get(p_idx, {})
            part_info = parts[p_idx]
            is_part3 = bool(re.search(r'(?:PHẦN|PART|SECTION)\s*(?:III|3)\b', part_info["label"].upper()))
            
            if cfg.get("shuffle_options") and not is_part3:
                for q_id in block["qids"]:
                    if q_id in qmap and len(qmap[q_id].options) == 4:
                        order = [0, 1, 2, 3]
                        rng.shuffle(order)
                        option_perm[q_id] = [qmap[q_id].options[idx] for idx in order]
